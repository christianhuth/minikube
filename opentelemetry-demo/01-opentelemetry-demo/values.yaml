---
opentelemetry-demo:
  components:
    frontend:
      envOverrides:
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://otel-demo.127.0.0.1.nip.io/otlp-http/v1/traces
    frontendProxy:
      ingress:
        enabled: true
        annotations: {}
        hosts:
          - host: otel-demo.127.0.0.1.nip.io
            paths:
              - path: /
                pathType: Prefix
                port: 8080
  opentelemetry-collector:
    resources:
      limits:
        memory: 500Mi
